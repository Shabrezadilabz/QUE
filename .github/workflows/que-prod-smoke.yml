# Weekly production smoke + Monk E2E (S1.7)
# Requires GitHub secrets: QUE_API_BASE, MONK_E2E_EMAIL, MONK_E2E_PASSWORD, MONK_E2E_WORKSPACE_ID (optional)

name: Que prod smoke

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: API smoke (health, auth, core flows)
        env:
          QUE_API_BASE: ${{ secrets.QUE_API_BASE }}
        run: npm run test:smoke

  scim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: SCIM + Sprint 8–12 unit smoke (no DB)
        run: npm run test:scim && npm run test:sprint8 && npm run test:sprint9 && npm run test:sprint10 && npm run test:sprint11 && npm run test:sprint12 && npm run test:load

  monk-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Monk prod E2E (cert → CEO → Genie)
        env:
          QUE_API_BASE: ${{ secrets.QUE_API_BASE }}
          MONK_E2E_EMAIL: ${{ secrets.MONK_E2E_EMAIL }}
          MONK_E2E_PASSWORD: ${{ secrets.MONK_E2E_PASSWORD }}
          MONK_E2E_WORKSPACE_ID: ${{ secrets.MONK_E2E_WORKSPACE_ID }}
        run: npm run test:monk-prod
