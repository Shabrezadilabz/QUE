# Que production deploy gate + weekly prod smoke (S1.7 + platform hub)
# Secrets (live API jobs): QUE_API_BASE, MONK_E2E_EMAIL, MONK_E2E_PASSWORD, MONK_E2E_WORKSPACE_ID

name: Que prod smoke

on:
  push:
    branches: [main]
    paths:
      - 'schemagraph/**'
      - '.github/workflows/que-prod-smoke.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Pre-deploy gate (platform + phase unit tests, no DB)
        run: npm run test:deploy-gate

      - name: UI production build
        working-directory: schemagraph
        run: npm ci && npm run build

  unit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: SCIM + Sprint 8-12 unit smoke (no DB)
        run: npm run test:scim && npm run test:sprint8 && npm run test:sprint9 && npm run test:sprint10 && npm run test:sprint11 && npm run test:sprint12 && npm run test:load

  smoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-gate, unit-gate]
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: API smoke (health, auth, platform hub, observe, pack studio, agent)
        env:
          QUE_API_BASE: ${{ secrets.QUE_API_BASE }}
        run: npm run test:smoke

  monk-prod:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    defaults:
      run:
        working-directory: schemagraph/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schemagraph/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Monk prod E2E (cert, CEO chat, Genie)
        env:
          QUE_API_BASE: ${{ secrets.QUE_API_BASE }}
          MONK_E2E_EMAIL: ${{ secrets.MONK_E2E_EMAIL }}
          MONK_E2E_PASSWORD: ${{ secrets.MONK_E2E_PASSWORD }}
          MONK_E2E_WORKSPACE_ID: ${{ secrets.MONK_E2E_WORKSPACE_ID }}
        run: npm run test:monk-prod
